name: Export MaiBot Image

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pull MaiBot
        run: |
          docker pull --platform linux/amd64 \
            sengokucola/maibot:1.3.8

      - name: Export image
        run: |
          docker save sengokucola/maibot:1.3.8 \
            | gzip -6 > maibot-1.3.8-amd64.tar.gz
          ls -lh maibot-1.3.8-amd64.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: maibot-image-amd64
          path: maibot-1.3.8-amd64.tar.gz
          retention-days: 1
          compression-level: 0
